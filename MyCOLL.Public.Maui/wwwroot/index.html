<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>MyCOLL Mobile</title>
    <base href="/" />
    
    <link rel="stylesheet" href="_content/MyCOLL.RCL/bootstrap/bootstrap.min.css" />
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <link rel="stylesheet" href="_content/MyCOLL.RCL/app.css" /></head>

<body>
    <div id="app">A carregar MyCOLL...</div>

    <div id="blazor-error-ui">
        Ocorreu um erro.
        <a href="" class="reload">Recarregar</a>
        <a class="dismiss">🗙</a>
    </div>

    <script src="_framework/blazor.webview.js" autostart="false"></script>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        window.scrollSlider = (elementId, amount) => {
            const element = document.getElementById(elementId);
            if (element) element.scrollLeft += amount;
        };
    </script>
</body>
</html>
