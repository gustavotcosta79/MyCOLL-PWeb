<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MyCOLL Public</title>
    <base href="/" />

    <link rel="stylesheet" href="_content/MyCOLL.RCL/bootstrap/bootstrap.min.css" />
    <link rel="stylesheet" href="_content/MyCOLL.RCL/app.css" />

    <link rel="stylesheet" href="MyCOLL.Public.styles.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="icon" type="image/png" href="_content/MyCOLL.RCL/favicon.png" />


</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">🗙</a>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="_framework/blazor.webassembly.js"></script>

    <script>
        // Função para mover o scroll horizontalmente
        window.scrollSlider = (elementId, amount) => {
            const element = document.getElementById(elementId);
            if (element) {
                element.scrollLeft += amount;
            }
        };
    </script>
</body>

</html>
